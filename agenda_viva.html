<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Agenda viva — Ogni posto conta</title>
  <meta name="description" content="Agenda viva — Ogni posto conta. Il programma di riassegnazione automatica degli appuntamenti sanitari di ATS Liguria." />

  <style>
    /* ============================================================
       Pagina di chiusura: solo il logo, centrato a tutto schermo
       ============================================================ */
    :root {
      --sfondo: #F4F6F8; --bordo: #DAE0E6;
      --testo-sec: #5B6B7A; --ambra: #B07206; --blu: #185FA5;
    }
    *, *::before, *::after { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      min-height: 100vh;
      display: grid; place-items: center;
      background: var(--sfondo); padding: 24px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    /* Contenitore del logo: usa aspect-ratio per scalare correttamente */
    .stage {
      width: min(88vw, 980px);
      aspect-ratio: 600 / 320;
    }
    .stage svg { width: 100%; height: 100%; display: block; }

    /* Link "Torna al sito" discreto in alto a sinistra */
    .back {
      position: fixed; top: 18px; left: 18px;
      font-size: .92rem; color: var(--testo-sec); text-decoration: none;
      background: rgba(255,255,255,.94);
      border: 1px solid var(--bordo); border-radius: 6px;
      padding: 8px 14px;
      transition: color .15s ease, background .15s ease, border-color .15s ease;
    }
    .back:hover { color: var(--blu); background: #fff; border-color: var(--blu); }
    .back:focus-visible { outline: 3px solid var(--ambra); outline-offset: 2px; }

    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; transition: none !important; }
    }
    @media (max-width: 560px) {
      .stage { width: 95vw; }
      .back  { top: 12px; left: 12px; font-size: .85rem; padding: 6px 10px; }
    }
  </style>
</head>
<body>

  <!-- Link di ritorno: discreto ma sempre raggiungibile da tastiera -->
  <a class="back" href="liste_attesa.html">← Torna al sito</a>

  <!-- Sprite SVG: definizione del logo Agenda viva (gradient + symbol) -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
    <defs>
      <linearGradient id="agArrowGrad" x1="0" y1="1" x2="1" y2="0">
        <stop offset="0" stop-color="#5BAFA5"/>
        <stop offset="1" stop-color="#6FBE5A"/>
      </linearGradient>

      <symbol id="logo-agendaviva" viewBox="0 0 600 320">
        <!-- Freccia circolare di "rinnovo" -->
        <path d="M 60 200 A 115 115 0 1 1 285 130"
              fill="none" stroke="url(#agArrowGrad)" stroke-width="13" stroke-linecap="round"/>
        <polygon points="296,142 268,118 280,100" fill="#6FBE5A"/>

        <!-- Calendario -->
        <rect x="90" y="105" width="135" height="138" rx="9" fill="#1B3553"/>
        <rect x="113" y="92" width="7" height="22" rx="3" fill="#1B3553"/>
        <rect x="195" y="92" width="7" height="22" rx="3" fill="#1B3553"/>
        <g fill="#B9C5D2">
          <rect x="101" y="130" width="25" height="22" rx="3"/>
          <rect x="130" y="130" width="25" height="22" rx="3"/>
          <rect x="159" y="130" width="25" height="22" rx="3"/>
          <rect x="188" y="130" width="25" height="22" rx="3"/>
          <rect x="101" y="156" width="25" height="22" rx="3"/>
          <rect x="130" y="156" width="25" height="22" rx="3"/>
          <rect x="159" y="156" width="25" height="22" rx="3" fill="#3DA84A"/>
          <rect x="188" y="156" width="25" height="22" rx="3"/>
          <rect x="101" y="182" width="25" height="22" rx="3"/>
          <rect x="130" y="182" width="25" height="22" rx="3"/>
          <rect x="159" y="182" width="25" height="22" rx="3"/>
          <rect x="188" y="182" width="25" height="22" rx="3"/>
        </g>

        <!-- Orologio -->
        <circle cx="220" cy="230" r="30" fill="#1B3553"/>
        <circle cx="220" cy="230" r="23" fill="#fff"/>
        <line x1="220" y1="230" x2="220" y2="215" stroke="#1B3553" stroke-width="3" stroke-linecap="round"/>
        <line x1="220" y1="230" x2="234" y2="230" stroke="#1B3553" stroke-width="3" stroke-linecap="round"/>
        <circle cx="220" cy="230" r="2.5" fill="#1B3553"/>

        <!-- Wordmark -->
        <text x="305" y="148" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif"
              font-weight="700" font-size="80" fill="#1B3553" letter-spacing="-1">Agenda</text>
        <text x="305" y="234" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif"
              font-weight="700" font-size="80" fill="#3DA89F" letter-spacing="-1">Viva</text>

        <!-- ECG sotto "Viva" -->
        <path d="M 305 255 L 365 255 L 372 244 L 380 270 L 388 232 L 397 270 L 405 255 L 510 255"
              fill="none" stroke="#3DA89F" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

        <!-- Claim -->
        <text x="305" y="298" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif"
              font-weight="600" font-size="28" fill="#4A5E70">Ogni posto conta</text>
      </symbol>
    </defs>
  </svg>

  <!-- Logo a centro pagina -->
  <main class="stage" aria-label="Logo Agenda viva">
    <svg viewBox="0 0 600 320" role="img" aria-label="Agenda viva — Ogni posto conta">
      <use href="#logo-agendaviva"/>
    </svg>
  </main>

</body>
</html>
